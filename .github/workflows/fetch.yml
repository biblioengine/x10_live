name: 投稿を取得

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと（GitHub の混み具合で数分遅れることがあります）
  workflow_dispatch:          # Actions 画面の「Run workflow」で手動実行もできる

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: X から取得して data.json を更新
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 scripts/fetch.py

      - name: 変更があれば保存
        run: |
          git config user.name "x10-live-bot"
          git config user.email "x10-live-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
